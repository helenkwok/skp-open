[package]
name = "skp-open"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-only"
description = "Open SketchUp (.skp) converter: SKP to IFC, IFCX, glTF, OBJ, USD, Fragments and DXF, and Revit (.rvt) to SKP, built on skpwright and rvt-open."
repository = "https://github.com/helenkwok/skp-open"
readme = "README.md"
publish = false

[dependencies]
# Reads and writes .skp (GPL-3.0-only, crates.io 0.6.1, published by its author's CI account).
skpwright = "=0.6.1"
# Reads .rvt and writes every format below (Apache-2.0), pinned to a commit of its main branch.
# rvt-open never depends on this crate.
rvt-open = { git = "https://github.com/helenkwok/rvt-open", rev = "c1e4202db177a2aec1b41e88d2e42cee01bafaec" }
# Cuts a face with holes into triangles (MIT OR Apache-2.0), the version rvt-open's lock holds.
earcut = "=0.4.12"
# Errors for the command-line tool.
anyhow = "=1.0.104"
# The values of the graph's attributes (the version rvt-open locks).
serde_json = "=1.0.154"

[lints.rust]
unused_qualifications = "warn"

# The chunk size is the triangle size; loops over x, y, z index three arrays.
[lints.clippy]
chunks_exact_to_as_chunks = "allow"
needless_range_loop = "allow"
